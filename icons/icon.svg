<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a322b"/><stop offset="1" stop-color="#2b2622"/>
    </linearGradient>
    <filter id="marble" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.05" numOctaves="4" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.86  0 0 0 0 0.89  0 0 0 0 0.94  -3.2 0 0 0 1.25"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f4f5"/><stop offset="0.5" stop-color="#6f757c"/><stop offset="1" stop-color="#d0d3d6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#desk)"/>
  <!-- box file, kept inside the maskable safe zone -->
  <g transform="translate(128 96)">
    <rect x="6" y="10" width="262" height="330" rx="14" fill="#000" opacity="0.45"/>
    <rect x="0" y="0" width="22" height="320" rx="8" fill="#151515"/>
    <rect x="16" y="0" width="240" height="320" rx="10" fill="#2d3640"/>
    <rect x="16" y="0" width="240" height="320" rx="10" fill="#fff" filter="url(#marble)"/>
    <rect x="16" y="0" width="240" height="320" rx="10" fill="none" stroke="#121212" stroke-width="7"/>
    <rect x="58" y="44" width="156" height="78" fill="url(#metal)"/>
    <rect x="64" y="50" width="144" height="66" fill="#f6f0de"/>
    <rect x="84" y="68" width="104" height="8" rx="2" fill="#1f2a44"/>
    <rect x="96" y="88" width="80" height="6" rx="2" fill="#6f665b" opacity="0.7"/>
    <circle cx="214" cy="200" r="22" fill="#0c0b0a" stroke="#b8bcc1" stroke-width="6"/>
    <rect x="250" y="182" width="12" height="36" rx="3" fill="url(#metal)"/>
  </g>
</svg>
