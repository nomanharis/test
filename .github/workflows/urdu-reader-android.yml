name: Urdu Parho Android build

on:
  push:
    paths:
      - "urdu-reader/**"
      - ".github/workflows/urdu-reader-android.yml"
  pull_request:
    paths:
      - "urdu-reader/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urdu-reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: urdu-parho-apk
          path: urdu-reader/app/build/outputs/apk/debug/app-debug.apk
